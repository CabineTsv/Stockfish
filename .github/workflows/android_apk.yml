name: Android APK

# Builds the Stockfish engine for Android (64-bit ARM) with the Android NDK, bundles it into the
# chess app in android/, and produces an installable APK on every push, pull request and manual run.
#
#  * The finished APK is attached to the run as an artifact ("Stockfish-APK").
#  * Pushes to the default branch (and manual runs with "publish" ticked) also update the
#    "android-latest" pre-release on the Releases page, which is the easiest place to download from
#    a phone.
#  * The engine is cached, so runs that only touch the app (android/**) finish in a few minutes.
#  * Default-branch pushes build the engine with profile-guided optimization (slow, fastest engine);
#    pull requests and other branches get a quicker plain optimized build.
#
# Optional repository secrets for signing with your own key (otherwise a built-in debug key is used):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
    inputs:
      pgo:
        description: 'Profile-guided optimization of the engine (slower build, faster engine)'
        type: boolean
        default: true
      publish:
        description: 'Publish the APK to the android-latest pre-release'
        type: boolean
        default: true

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Same NDK and architecture the upstream Android CI uses (see .github/ci/arm_matrix.json).
  NDK_VERSION: '28.2.13676358'
  ENGINE_ARCH: arm64-universal
  # Bump to throw away every cached engine build.
  ENGINE_CACHE_VERSION: v1

jobs:
  build-apk:
    name: Build Stockfish APK
    # Same runner image as the upstream Android CI (.github/ci/arm_matrix.json), where the engine
    # build and the qemu training run are known to work. Move to ubuntu-24.04 when 22.04 retires.
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    permissions:
      contents: write
    env:
      # Optimized (profile-guided) engine for default-branch pushes and manual runs; quicker plain
      # builds for pull requests and other branches.
      USE_PGO: ${{ ((github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) || (github.event_name == 'workflow_dispatch' && inputs.pgo)) && 'true' || 'false' }}
      APP_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      # ---------------------------------------------------------------- tests of the app code

      - name: Chess rules tests (perft)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rules-test"
          javac -d "$RUNNER_TEMP/rules-test" \
            android/app/src/main/java/dev/stuckfih/chess/core/*.java \
            android/tests/ChessCoreTest.java
          java -cp "$RUNNER_TEMP/rules-test" ChessCoreTest

      - name: Engine protocol tests (app UCI layer against a reference Stockfish)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq stockfish
          mkdir -p "$RUNNER_TEMP/uci-test"
          javac -d "$RUNNER_TEMP/uci-test" \
            android/app/src/main/java/dev/stuckfih/chess/core/*.java \
            android/app/src/main/java/dev/stuckfih/chess/UciProcess.java \
            android/app/src/main/java/dev/stuckfih/chess/EngineSession.java \
            android/tests/EngineIntegrationTest.java
          java -cp "$RUNNER_TEMP/uci-test" EngineIntegrationTest /usr/games/stockfish

      # ---------------------------------------------------------------- the engine

      - name: Look for a cached engine build
        id: engine-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: engine-out/libstockfish.so
          key: engine-${{ env.ENGINE_CACHE_VERSION }}-ndk${{ env.NDK_VERSION }}-pgo${{ env.USE_PGO }}-${{ hashFiles('src/**', 'scripts/net.sh') }}

      - name: Install the Android NDK and the qemu emulator
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}"
          NDK_BIN="$SDK/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          ls -l "$NDK_BIN/aarch64-linux-android29-clang++"
          echo "NDK_BIN=$NDK_BIN" >> "$GITHUB_ENV"

      - name: Build the engine (arm64, Android NDK, static)
        if: steps.engine-cache.outputs.cache-hit != 'true'
        working-directory: src
        run: |
          set -euo pipefail
          export PATH="$NDK_BIN:$PATH"
          export LDFLAGS="-static -Wno-unused-command-line-argument"
          make net
          make clean
          if [ "$USE_PGO" = "true" ]; then
            # Profile-guided build; the training run executes the arm64 binary under qemu.
            if ! make -j"$(nproc)" profile-build ARCH="$ENGINE_ARCH" COMP=ndk RUN_PREFIX=qemu-aarch64; then
              echo "::warning::The profile-guided build failed; falling back to a regular optimized build."
              make clean
              make -j"$(nproc)" build ARCH="$ENGINE_ARCH" COMP=ndk
            fi
          else
            make -j"$(nproc)" build ARCH="$ENGINE_ARCH" COMP=ndk
          fi
          make strip ARCH="$ENGINE_ARCH" COMP=ndk
          mkdir -p ../engine-out
          cp stockfish ../engine-out/libstockfish.so
          ls -l ../engine-out/libstockfish.so

      - name: Smoke-test the Android engine (emulated)
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          info=$(file engine-out/libstockfish.so)
          echo "$info"
          grep -q 'ARM aarch64' <<< "$info" || { echo "::error::The engine is not an arm64 executable"; exit 1; }
          out=$(printf 'uci\nisready\nposition startpos\ngo depth 10\nquit\n' | qemu-aarch64 engine-out/libstockfish.so)
          echo "$out" | tail -n 12
          grep -q '^uciok' <<< "$out"
          grep -q '^bestmove' <<< "$out"

      - name: Cache the engine
        if: steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: engine-out/libstockfish.so
          key: ${{ steps.engine-cache.outputs.cache-primary-key }}

      - name: App protocol test against the Android engine (emulated, informational)
        if: steps.engine-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 15
        run: |
          set -euo pipefail
          java -cp "$RUNNER_TEMP/uci-test" EngineIntegrationTest fast qemu-aarch64 "$PWD/engine-out/libstockfish.so"

      # ---------------------------------------------------------------- the app

      - name: Bundle the engine into the app
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp engine-out/libstockfish.so android/app/src/main/jniLibs/arm64-v8a/libstockfish.so
          ls -l android/app/src/main/jniLibs/arm64-v8a/

      - name: Prepare the signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Signing with the release keystore from the repository secrets."
          else
            mkdir -p "$HOME/.android"
            base64 -d android/signing/debug.keystore.b64 > "$HOME/.android/debug.keystore"
            echo "No release keystore secret found: signing with the bundled debug key."
          fi

      - name: Prepare the Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '8.10.2'
          cache-disabled: true

      - name: Build the APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Check the APK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          BT="$SDK/build-tools/35.0.0"
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -l "$APK"
          listing=$(unzip -l "$APK")
          grep -q 'lib/arm64-v8a/libstockfish.so' <<< "$listing" || { echo "::error::The engine is missing from the APK"; exit 1; }
          "$BT/apksigner" verify --verbose "$APK"
          manifest=$("$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK" || true)
          if grep -Ei 'extractNativeLibs.*(false|0x0)' <<< "$manifest"; then
            echo "::error::extractNativeLibs is false, so Android would not unpack the engine on install"
            exit 1
          fi
          "$BT/aapt2" dump badging "$APK" | grep -E "^package:|^sdkVersion|^targetSdkVersion|^native-code" || true

      - name: Name the APK
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/Stockfish-${APP_VERSION_NAME}.apk"
          {
            echo "### Stockfish APK ${APP_VERSION_NAME}"
            echo ""
            echo "- Size: $(du -h "dist/Stockfish-${APP_VERSION_NAME}.apk" | cut -f1)"
            echo "- Engine: arm64-universal, NDK ${NDK_VERSION}, profile-guided build: ${USE_PGO}"
            echo "- Source commit: \`${GITHUB_SHA::7}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Stockfish-APK
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish the android-latest pre-release
        if: >-
          (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
          || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG=android-latest
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" dist/*.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Stockfish for Android (build ${GITHUB_RUN_NUMBER})" \
            --notes "Automatic build of commit ${GITHUB_SHA::7} (workflow run ${GITHUB_RUN_NUMBER}). Install the .apk on a 64-bit ARM phone running Android 10 or newer."
